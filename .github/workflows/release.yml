name: Release package

# Publish a release on GitHub (tag such as v2.0.0) and this workflow builds the theme
# and attaches theme.tar.gz and its checksum to it. It can also be re-run by hand for a tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the package to, e.g. v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches theme.json
        run: |
          version=$(node -p "require('./theme.json').version")
          test "v$version" = "$TAG" || { echo "theme.json is $version but the tag is $TAG"; exit 1; }
      - run: npm run package
      - name: Attach the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" theme.tar.gz theme.tar.gz.sha256 --clobber
