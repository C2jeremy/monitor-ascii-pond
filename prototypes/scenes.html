<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素场景原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-viewport character canvas; glass controls float above it, node roster docked right (bottom sheet on phones). */
:root {
  --bg: #f4f2ec;
  --fg: #2c2a26;
  --muted: #5f5b54;
  --faint: #8a847a;
  --line: rgba(44, 42, 38, 0.12);
  --tab: rgba(44, 42, 38, 0.06);
  --glass: rgba(250, 249, 246, 0.72);
  --glass-edge: rgba(255, 255, 255, 0.75);
  --shadow: 0 1px 2px rgba(60, 45, 30, 0.06), 0 12px 30px -16px rgba(60, 45, 30, 0.32);
  --accent: #ad4637;
  --ok: #4f7a52;
  --warn: #b5701c;
  --crit: #b8382a;
  --sea-1: #e6f0ef;
  --sea-2: #cadedd;
  --map-1: #f3f1ea;
  --map-2: #e8e4d8;
  --forest-1: #e9f0e5;
  --forest-2: #f6efe0;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111417; --fg: #e4dfd4; --muted: #aaa397; --faint: #7d776d;
    --line: rgba(255, 240, 220, 0.1); --tab: rgba(255, 240, 220, 0.06);
    --glass: rgba(20, 23, 27, 0.66); --glass-edge: rgba(255, 245, 230, 0.06);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 14px 34px -16px rgba(0, 0, 0, 0.8);
    --accent: #e8957f; --ok: #9ccf96; --warn: #e0a95c; --crit: #f07a68;
    --sea-1: #0c1c27; --sea-2: #03090f; --map-1: #121619; --map-2: #0c0f12;
    --forest-1: #0a111d; --forest-2: #111a14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111417; --fg: #e4dfd4; --muted: #aaa397; --faint: #7d776d;
  --line: rgba(255, 240, 220, 0.1); --tab: rgba(255, 240, 220, 0.06);
  --glass: rgba(20, 23, 27, 0.66); --glass-edge: rgba(255, 245, 230, 0.06);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 14px 34px -16px rgba(0, 0, 0, 0.8);
  --accent: #e8957f; --ok: #9ccf96; --warn: #e0a95c; --crit: #f07a68;
  --sea-1: #0c1c27; --sea-2: #03090f; --map-1: #121619; --map-2: #0c0f12;
  --forest-1: #0a111d; --forest-2: #111a14;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.5 var(--sans);
  overflow: hidden;
}
body[data-scene="sea"] { background: linear-gradient(180deg, var(--sea-1), var(--sea-2)); }
body[data-scene="map"] { background: radial-gradient(120% 90% at 40% 45%, var(--map-1), var(--map-2)); }
body[data-scene="forest"] { background: linear-gradient(180deg, var(--forest-1), var(--forest-2)); }
#pond { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: manipulation; }

.ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: 10px 12px;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.35);
  backdrop-filter: blur(14px) saturate(1.35);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow);
}
.bar {
  grid-column: 1 / -1;
  pointer-events: auto;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 18px;
  padding: 8px 10px 8px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { font: 500 18px var(--mono); color: var(--accent); letter-spacing: -2px; }
.brand b { display: block; font: 500 16px/1.15 var(--serif); letter-spacing: 1px; }
.brand small { display: block; font-size: 11px; color: var(--muted); }
.tabs { display: flex; gap: 3px; padding: 3px; background: var(--tab); border-radius: 10px; }
.tabs button, .btn {
  font: inherit;
  color: var(--muted);
  background: transparent;
  border: 0;
  cursor: pointer;
}
.tabs button { padding: 5px 13px; border-radius: 8px; font-size: 13px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.actions .label { font-size: 11px; color: var(--faint); margin-right: 2px; }
.btn { font-size: 12px; color: var(--fg); border: 1px solid var(--line); padding: 4px 10px; border-radius: 8px; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.btn[aria-pressed="false"] { color: var(--muted); }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend {
  grid-column: 1;
  grid-row: 2;
  justify-self: start;
  max-width: 100%;
  margin: 0;
  padding: 7px 14px;
  font-size: 12px;
  color: var(--muted);
  text-wrap: pretty;
}
.legend b { color: var(--fg); font-weight: 500; font-family: var(--serif); margin-right: 6px; }

.roster {
  grid-column: 2;
  grid-row: 2 / 4;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  align-self: start;
  max-height: 100%;
}
.roster-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 11px 14px 8px; font-size: 11px; color: var(--muted); }
.roster-head b { font: 500 15px var(--serif); color: var(--fg); }
.roster-head span { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.list { overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 4px; padding: 0 8px 8px; }
.node {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 8px;
  text-align: left;
  font: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 7px 10px;
  cursor: pointer;
}
.node:hover, .node.focus { background: var(--tab); border-color: var(--line); }
.node.pinned { border-color: var(--accent); }
.n-name { font: 14px var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.n-code { font: 10px var(--mono); color: var(--faint); margin-left: 6px; letter-spacing: 1px; }
.pill { font-size: 11px; padding: 0 8px; border-radius: 999px; color: var(--ok); background: color-mix(in srgb, currentColor 14%, transparent); align-self: center; }
.pill.warn { color: var(--warn); }
.pill.off { color: var(--faint); }
.n-m { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 6px; font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.n-m b { color: var(--fg); font-weight: 500; }
.n-m .warn b { color: var(--warn); }
.n-m .crit b { color: var(--crit); font-weight: 600; }
.node.offline .n-name { color: var(--muted); }
.node.offline { opacity: 0.75; }
.cards-off .roster { display: none; }

.toast {
  position: fixed;
  left: 50%;
  bottom: max(20px, env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px);
  padding: 7px 14px;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .ui { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .roster { grid-column: 1; grid-row: 4; max-height: 34vh; align-self: end; }
  .bar { gap: 8px; padding: 8px; }
  .brand small { display: none; }
  .actions { margin-left: 0; }
  .actions .label { display: none; }
  .btn { padding: 3px 8px; }
  .tabs button { padding: 4px 10px; }
  .toast { bottom: calc(34vh + 40px); }
}
@media (prefers-reduced-transparency: reduce) {
  .glass { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
</style>
</head>
<body data-scene="sea">
<canvas id="pond" aria-label="背景场景，点击可互动"></canvas>
<div class="ui">
  <header class="bar glass">
    <div class="brand">
      <span class="mark" aria-hidden="true">▚▞</span>
      <div><b>像素场景</b><small>Pond 背景原型 · 演示数据</small></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="场景">
      <button type="button" role="tab" id="tab-sea" data-scene="sea">深海水母</button>
      <button type="button" role="tab" id="tab-map" data-scene="map">世界航线</button>
      <button type="button" role="tab" id="tab-forest" data-scene="forest">萤火森林</button>
    </nav>
    <div class="actions">
      <span class="label">模拟：</span>
      <button type="button" class="btn" id="ev-off">断开一台</button>
      <button type="button" class="btn" id="ev-cpu">压测一台</button>
      <button type="button" class="btn" id="ev-net">流量暴涨</button>
      <button type="button" class="btn" id="ev-reset">全部恢复</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="btn" id="theme">切换明暗</button>
      <button type="button" class="btn" id="cards" aria-pressed="true">节点卡片</button>
    </div>
  </header>
  <p class="legend glass" id="legend"></p>
  <aside class="roster glass" id="roster" aria-label="节点">
    <div class="roster-head"><b>节点</b><span id="sum"></span></div>
    <div class="list" id="list"></div>
  </aside>
</div>
<div class="toast glass" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const cv = $("#pond");
  const ctx = cv.getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const darkMQ = matchMedia("(prefers-color-scheme: dark)");
  const store = {
    get(k) { try { return localStorage.getItem("pond-scenes:" + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("pond-scenes:" + k, v); } catch {} },
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const MB = 1048576;
  const hash = (x, y) => {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  const vnoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const s = (t) => t * t * (3 - 2 * t);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    const u = s(xf), v = s(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const norm180 = (l) => ((((l + 180) % 360) + 360) % 360) - 180;
  const km = (a, b) => {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
    return 2 * 6371 * Math.asin(Math.sqrt(h));
  };
  const isDark = () => {
    const t = document.documentElement.dataset.theme;
    return t === "dark" || (t !== "light" && darkMQ.matches);
  };
  const savedTheme = store.get("theme");
  if (savedTheme === "dark" || savedTheme === "light") document.documentElement.dataset.theme = savedTheme;

  // ---------------- 演示节点 ----------------
  // lo = 地图上标签的偏移 [dx, dy, 对齐]
  const NODES = [
    { name: "HK-Tsuen-Wan-01", code: "HKG", lat: 22.3, lon: 114.2, mem: 0.37, disk: 0.2, load: 23, net: 4.2, lo: [-1.3, 1.3, "right"] },
    { name: "Tokyo-Linode-NRT", code: "NRT", lat: 35.7, lon: 139.7, mem: 0.51, disk: 0.83, load: 61, net: 1.1, lo: [0, 2, "center"] },
    { name: "SG-DigitalOcean", code: "SIN", lat: 1.35, lon: 103.8, mem: 0.6, disk: 0.65, load: 8, net: 0.23, lo: [0, 2, "center"] },
    { name: "Seoul-Oracle-ARM", code: "ICN", lat: 37.5, lon: 127, mem: 0.71, disk: 0.47, load: 3, net: 0.08, lo: [1.2, -1.5, "left"] },
    { name: "LA-CN2-GIA", code: "LAX", lat: 34, lon: -118.2, mem: 0.86, disk: 0.29, load: 41, net: 9.8, lo: [-1.4, 1, "right"] },
    { name: "NYC-Vultr-HighFreq", code: "JFK", lat: 40.7, lon: -74, mem: 0.38, disk: 0.92, load: 88, net: 0.6, lo: [1.4, 1.2, "left"] },
    { name: "Toronto-OVH", code: "YYZ", lat: 43.7, lon: -79.4, mem: 0.45, disk: 0.4, load: 0, net: 0, off: true, lo: [-1.3, -1.4, "right"] },
    { name: "Frankfurt-Hetzner", code: "FRA", lat: 50.1, lon: 8.7, mem: 0.55, disk: 0.33, load: 35, net: 2.6, lo: [1.4, 1.4, "left"] },
    { name: "London-Contabo", code: "LHR", lat: 51.5, lon: -0.1, mem: 0.42, disk: 0.21, load: 17, net: 1.4, lo: [-1.4, 0.2, "right"] },
    { name: "Amsterdam-Backup", code: "AMS", lat: 52.4, lon: 4.9, mem: 0.3, disk: 0.78, load: 5, net: 0.05, lo: [1.2, -1.5, "left"] },
    { name: "Shanghai-Aliyun", code: "PVG", lat: 31.2, lon: 121.5, mem: 0.66, disk: 0.5, load: 52, net: 3.3, lo: [1.5, 0.4, "left"] },
    { name: "Home-NAS-Beijing", code: "PEK", lat: 39.9, lon: 116.4, mem: 0.5, disk: 0.88, load: 0, net: 0, off: true, lo: [-1.4, -1.2, "right"] },
  ].map((n, i) => ({
    ...n, i, online: !n.off, forcedOff: false, stress: 0,
    cpu: n.off ? 0 : n.load, rx: 0, tx: 0, memNow: n.mem,
    s: { cpu: n.off ? 0 : n.load, net: n.off ? 0 : n.net * MB * 1.3, mem: n.mem },
  }));
  let surge = 0;
  function simulate() {
    const t = performance.now() / 1000;
    for (const n of NODES) {
      n.online = !n.off && !n.forcedOff;
      if (!n.online) { n.cpu = 0; n.rx = n.tx = 0; continue; }
      const w = (p) => 0.5 + 0.5 * Math.sin(t / p + n.i * 1.7);
      n.cpu = n.stress > 0 ? 94 + Math.random() * 5 : clamp(n.load * (0.7 + 0.6 * w(7)) + Math.random() * 4, 0, 100);
      n.memNow = clamp(n.mem + 0.04 * (w(13) - 0.5), 0, 0.98);
      n.rx = n.net * MB * (0.4 + w(3)) * (surge > 0 ? 5 : 1);
      n.tx = n.rx * 0.35;
    }
  }
  const level = (v) => (v >= 90 ? "crit" : v >= 75 ? "warn" : "");
  // 调色板索引：0 墨 1 强调 2 警告 3 危险 4 离线，5 起为场景自用
  const stateCol = (n) => (!n.online ? 4 : n.s.cpu >= 90 ? 3 : n.s.cpu >= 75 ? 2 : -1);
  const rate = (b) => (b < 1024 ? Math.round(b) + " B/s" : b < MB ? Math.round(b / 1024) + " KB/s" : (b / MB).toFixed(1) + " MB/s");

  // ---------------- 字符网格 ----------------
  const G = { cs: 10, cols: 0, rows: 0, ink: null, col: null, ch: null, mode: null, labels: [], view: { x0: 0, x1: 0, y0: 0, y1: 0 } };
  let W = 0, H = 0, dpr = 1;
  const mouse = { x: -99, y: -99, on: false };
  let hoverId = null, pinned = null, focusId = null;

  function plot(x, y, ink, col, ch, mode) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= G.cols || y >= G.rows || !(ink > 0)) return;
    const i = y * G.cols + x;
    if (ink < G.ink[i]) return;
    G.ink[i] = ink > 1 ? 1 : ink;
    G.col[i] = col;
    G.ch[i] = ch ? ch.charCodeAt(0) : 0;
    G.mode[i] = mode || 0;
  }
  const label = (x, y, text, o) => G.labels.push({ x, y, text, ...o });

  const LV = 6;
  function render(pal, ground) {
    const { cs, cols, ink, col, ch, mode } = G;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const buckets = new Map();
    for (let i = 0; i < ink.length; i++) {
      const v = ink[i];
      if (v < 0.03) continue;
      const key = ((mode[i] * 32 + col[i]) * LV) + Math.min(LV - 1, (v * LV) | 0);
      let b = buckets.get(key);
      if (!b) buckets.set(key, (b = []));
      b.push(i);
    }
    const pad = cs > 7 ? 1 : 0.6;
    for (const [key, b] of buckets) {
      const lvl = key % LV, rest = (key - lvl) / LV, c = rest % 32, m = (rest - c) / 32;
      if (m !== 0) continue;
      ctx.globalAlpha = (lvl + 1) / LV;
      ctx.fillStyle = pal[c];
      for (const i of b) ctx.fillRect((i % cols) * cs + pad / 2, ((i / cols) | 0) * cs + pad / 2, cs - pad, cs - pad);
    }
    ctx.font = `${Math.round(cs * 0.95)}px ${getComputedStyle(document.body).getPropertyValue("--mono")}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const [key, b] of buckets) {
      const lvl = key % LV, rest = (key - lvl) / LV, c = rest % 32, m = (rest - c) / 32;
      if (m === 0) {
        if (lvl < 2) continue;
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = ground;
      } else {
        ctx.globalAlpha = (lvl + 1) / LV;
        ctx.fillStyle = pal[c];
      }
      for (const i of b) {
        if (!ch[i]) continue;
        ctx.fillText(String.fromCharCode(ch[i]), (i % cols) * cs + cs / 2, ((i / cols) | 0) * cs + cs / 2 + 0.5);
      }
    }
    ctx.font = `500 11px ${getComputedStyle(document.body).getPropertyValue("--mono")}`;
    ctx.lineJoin = "round";
    ctx.lineWidth = 3;
    ctx.strokeStyle = ground;
    for (const l of G.labels) {
      const x = l.x * cs + cs / 2, y = l.y * cs + cs / 2;
      ctx.textAlign = l.align || "center";
      ctx.globalAlpha = (l.alpha ?? 1) * (l.focus ? 1 : 0.88);
      ctx.strokeText(l.text, x, y);
      ctx.fillStyle = l.focus ? pal[1] : pal[l.col != null && l.col >= 0 ? l.col : 0];
      ctx.fillText(l.text, x, y);
    }
    ctx.globalAlpha = 1;
  }

  // ---------------- 场景一：深海水母 ----------------
  const sea = {
    key: "sea",
    title: "深海水母",
    legend: () => "一只水母 = 一台服务器 · 脉动快慢 = CPU · 体型 = 内存 · 气泡 = 网络流量 · 熄灭沉底 = 离线 · 点击水中：搅动水流",
    cs: (w) => (w < 640 ? 8 : 10),
    pal: (d) => d
      ? { c: ["#a9bcc6", "#ff9a7a", "#f3b562", "#ff6b5b", "#4d5a63", "#ff8fb1", "#6fd3e8", "#b49cff", "#ffc07a", "#7fbfd2", "#3b7f93", "#3f8a5c", "#4a473b"], g: "#06121a" }
      : { c: ["#4e5d66", "#c4553f", "#b5701c", "#b8382a", "#98a3a6", "#c9587f", "#3a83a0", "#7a5fae", "#c47a2c", "#4f8fa6", "#7fb3ba", "#5a8a58", "#a8987a"], g: "#eef5f4" },
    init() {
      this.j = NODES.map((n, i) => ({ x: 0, y: 0, vx: 0, vy: 0, ph: hash(i, 1) * 6.28, hue: 5 + (i % 4) }));
      this.bub = [];
      this.rip = [];
    },
    resize() {
      const v = G.view;
      this.bed = v.y1 - 3;
      this.sc = clamp((v.x1 - v.x0) / 120, 0.6, 1.2);
      this.j.forEach((j, i) => {

      const by = (c) => NODES.find((n) => n.code === c).i;
      [["LAX", "HKG"], ["LAX", "NRT"], ["LAX", "PVG"], ["JFK", "LHR"], ["JFK", "FRA"], ["FRA", "SIN"], ["LHR", "HKG"], ["SIN", "HKG"]].forEach(([a, b]) => add(by(a), by(b)));
      this.edges = E;
      this.sunAt = -1e9;
    },
    resize() {
      const v = G.view, { cols, rows } = G;
      const w = v.x1 - v.x0, h = v.y1 - v.y0 - 1;
      this.k = Math.min(w / this.SPAN, h / this.LSPAN);
      this.ox = v.x0 + (w - this.SPAN * this.k) / 2;
      this.oy = v.y0 + (h - this.LSPAN * this.k) / 2;
      this.mask = new Uint8Array(cols * rows);
      this.grat = new Uint8Array(cols * rows);
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const g = this.inv(x + 0.5, y + 0.5);
        if (!g) continue;
        this.mask[y * cols + x] = inLand(g[0], g[1]) ? 1 : 3;
        const [la, lb] = [this.inv(x, y), this.inv(x + 1, y + 1)];
        if (la && lb) {
          const latLine = Math.floor(la[1] / 30) !== Math.floor(lb[1] / 30);
          const lonLine = Math.floor((la[0] + 180) / 30) !== Math.floor((lb[0] + 180) / 30) && Math.abs(lb[0] - la[0]) < 90;
          if ((latLine && x % 2 === 0) || (lonLine && y % 2 === 0)) this.grat[y * cols + x] = 1;
        }
      }
      for (let y = 1; y < rows - 1; y++) for (let x = 1; x < cols - 1; x++) {
        const i = y * cols + x;
        if (this.mask[i] === 1 && (this.mask[i - 1] === 3 || this.mask[i + 1] === 3 || this.mask[i - cols] === 3 || this.mask[i + cols] === 3)) this.mask[i] = 2;
      }
      this.routes = this.edges.map(([a, b]) => {
        const p = this.path(NODES[a], NODES[b]);
        const steps = Math.ceil(p.dist * this.k * 1.3), pts = [];
        for (let s = 0; s <= steps; s += 2) { const q = this.pt(p, s / steps); if (q[2]) pts.push(q); }
        return { a, b, pts };
      });
      this.night = null;
      this.sunAt = -1e9;
    },
    proj(lon, lat) {
      const u = norm180(lon - this.LON0) - this.LMIN;
      const vis = u >= 0 && u <= this.SPAN && lat <= this.TOP && lat >= this.TOP - this.LSPAN;
      return [this.ox + u * this.k, this.oy + (this.TOP - lat) * this.k, vis];
    },
    inv(x, y) {
      const u = (x - this.ox) / this.k, lat = this.TOP - (y - this.oy) / this.k;
      if (u < 0 || u > this.SPAN || lat > this.TOP || lat < this.TOP - this.LSPAN) return null;
      return [norm180(u + this.LMIN + this.LON0), lat];
    },
    path(a, b) {
      const dlon = norm180(b.lon - a.lon);
      return { a: { lon: a.lon, lat: a.lat }, b: { lon: b.lon, lat: b.lat }, dlon, dist: Math.hypot(dlon, b.lat - a.lat) || 1 };
    },
    pt(p, t) {
      const lift = Math.min(16, p.dist * 0.16);
      return this.proj(p.a.lon + p.dlon * t, p.a.lat + (p.b.lat - p.a.lat) * t + Math.sin(Math.PI * t) * lift);
    },
    updateNight() {
      const s = (this.sun = sunPos()), { cols, rows } = G, r = Math.PI / 180;
      const N = this.night || (this.night = new Float32Array(cols * rows));
      const sd = Math.sin(s.lat * r), cd = Math.cos(s.lat * r);
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (!this.mask[i]) { N[i] = 0; continue; }
        const [lon, lat] = this.inv(x + 0.5, y + 0.5);
        const cz = Math.sin(lat * r) * sd + Math.cos(lat * r) * cd * Math.cos((lon - s.lon) * r);
        N[i] = clamp((0.06 - cz) / 0.12, 0, 1);
      }
    },
    launch(a, b, o) {
      const p = this.path(a, b);
      this.pk.push({ ...p, ...o, t: 0, sp: clamp(16 / p.dist, 0.07, 0.6), seed: Math.random() });
      if (this.pk.length > 400) this.pk.shift();
    },
    step(dt, t) {
      if (t - this.sunAt > 20) { this.updateNight(); this.sunAt = t; }
      for (const n of NODES) {
        if (!n.online || Math.random() >= Math.min(5, 0.25 + (n.s.net / MB) * 0.6) * dt) continue;
        const es = this.edges.filter((e) => e[0] === n.i || e[1] === n.i);
        const e = es[Math.floor(Math.random() * es.length)];
        const to = e[0] === n.i ? e[1] : e[0];
        this.launch(n, NODES[to], { from: n.i, to, big: n.s.net > 3 * MB });
      }
      for (const p of this.pk) p.t += p.sp * dt;
      for (const p of this.pk.filter((q) => q.t >= 1)) {
        if (NODES[p.to].online) { this.flash[p.to] = 1; if (p.ping) this.ms.push({ i: p.to, v: p.ms, t: 2.6 }); }
        else this.lost.push({ i: p.to, t: 1.2 });
      }
      this.pk = this.pk.filter((q) => q.t < 1);
      for (let i = 0; i < this.flash.length; i++) this.flash[i] = Math.max(0, this.flash[i] - dt * 1.5);
      for (const m of this.ms) m.t -= dt;
      this.ms = this.ms.filter((m) => m.t > 0);
      for (const l of this.lost) l.t -= dt;
      this.lost = this.lost.filter((l) => l.t > 0);
      if (this.ping) { this.ping.t -= dt; if (this.ping.t <= 0) this.ping = null; }
    },
    ring(x, y, R, ink, col) {
      const steps = Math.max(6, Math.ceil(R * 6.3));
      for (let s = 0; s < steps; s++) { const a = (s / steps) * Math.PI * 2; plot(x + Math.cos(a) * R, y + Math.sin(a) * R, ink, col, "·", 1); }
    },
    draw(t) {
      const d = isDark(), { cols, rows } = G, N = this.night;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const i = y * cols + x, m = this.mask[i];
        if (!m) continue;
        const nt = N ? N[i] : 0;
        if (m !== 3) {
          const coast = m === 2 ? 0.1 : 0;
          if (d) plot(x, y, (0.24 + coast) * (1 - nt * 0.55), 5, 0, 0);
          else plot(x, y, 0.14 + coast + nt * 0.14, nt > 0.5 ? 8 : 5, 0, 0);
        } else if (nt > 0.3 && (x + y) % 3 === 0) plot(x, y, 0.24 * nt, 8, "/", 1);
        else if (this.grat[i]) plot(x, y, 0.12, 6, "·", 1);
        else if (hash(x, y) < 0.03) plot(x, y, 0.12 + 0.08 * Math.sin(t * 0.8 + x * 0.4 + y), 6, "~", 1);
      }
      if (this.sun) {
        const [sx, sy, vis] = this.proj(this.sun.lon, this.sun.lat);
        if (vis) { plot(sx, sy, 0.9, 2, "*", 0); this.ring(sx, sy, 1.6 + 0.3 * Math.sin(t * 2), 0.5, 2); }
      }
      for (const r of this.routes) {
        const live = NODES[r.a].online && NODES[r.b].online;
        for (const q of r.pts) plot(q[0], q[1], live ? 0.26 : 0.08, live ? 7 : 4, "·", 1);
      }
      for (const p of this.pk) {
        const [hx, hy, hv] = this.pt(p, p.t);
        const st = 1 / Math.max(8, p.dist * this.k * 1.2), col = p.ping ? 9 : 1;
        const flap = Math.floor(t * 7 + p.seed * 10) % 2 ? "v" : "^";
        if (hv) plot(hx, hy, 0.95, col, flap, 0);
        for (let j = 1; j <= 3; j++) { const q = this.pt(p, Math.max(0, p.t - st * j)); if (q[2]) plot(q[0], q[1], 0.5 - j * 0.12, col, "·", 1); }
        if (p.big && hv) {
          const [bx, by] = this.pt(p, Math.max(0, p.t - st * 1.6));
          let dx = hx - bx, dy = hy - by;
          const l = Math.hypot(dx, dy);
          if (l > 0 && l < 4) { dx /= l; dy /= l; plot(bx - dy * 1.2, by + dx * 1.2, 0.75, col, flap, 0); plot(bx + dy * 1.2, by - dx * 1.2, 0.75, col, flap, 0); }
        }
      }
      NODES.forEach((n, i) => {
        const [x, y, vis] = this.proj(n.lon, n.lat);
        if (!vis) return;
        const sc = stateCol(n), col = sc >= 0 ? sc : 9, foc = focusId === i;
        if (n.online) {
          const per = 2.4 - (n.s.cpu / 100) * 1.9, ph = ((t + i * 0.37) / per) % 1;
          this.ring(x, y, 0.8 + ph * 4, (1 - ph) * 0.65, col);
          if (this.flash[i] > 0) this.ring(x, y, (1 - this.flash[i]) * 2.5 + 1, this.flash[i] * 0.8, 1);
          plot(x, y, 1, col, "+", 0);
          for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) plot(x + ax, y + ay, 0.45, col, 0, 0);
        } else {
          plot(x, y, 0.9, 4, "x", 1);
          const f = Math.floor(t * 4);
          if (hash(f, i) < 0.3) plot(x + (hash(i, f) - 0.5) * 3, y + (hash(f, i + 9) - 0.5) * 2, 0.35, 4, "·", 1);
        }
        if (foc) this.ring(x, y, 3.2, 0.95, 1);
        label(x + n.lo[0], y + n.lo[1], n.code + (n.online ? ` ${Math.round(n.s.cpu)}%` : " 离线"), { align: n.lo[2], col: n.online ? (sc >= 0 ? sc : 0) : 4, focus: foc });
      });
      for (const m of this.ms) {
        const n = NODES[m.i], [x, y] = this.proj(n.lon, n.lat);
        label(x + n.lo[0], y + n.lo[1] + 1.6, m.v + " ms", { align: n.lo[2], col: 9, alpha: Math.min(1, m.t) });
      }
      for (const l of this.lost) {
        const n = NODES[l.i], [x, y] = this.proj(n.lon, n.lat);
        plot(x + 1, y - 1, l.t * 0.8, 4, "?", 1);
      }
      if (this.ping) this.ring(this.ping.x, this.ping.y, (1 - this.ping.t) * 6 + 0.5, this.ping.t * 0.9, 9);
    },
    click(x, y) {
      const g = this.inv(x, y);
      if (!g) return;
      const src = { lon: g[0], lat: g[1] };
      for (const n of NODES) {
        if (!n.online) continue;
        this.launch(src, n, { to: n.i, ping: true, ms: Math.round(km(src, n) / 100 + 3 + Math.random() * 5) });
      }
      this.ping = { x, y, t: 1 };
    },
  };

  // ---------------- 场景三：萤火森林 ----------------
  const forest = {
    key: "forest",
    title: "萤火森林",
    legend: (d) => d
      ? "夜晚 · 一棵树 = 一台服务器 · 萤火虫多少 = 流量 · 闪烁快慢 = CPU · 枯树 = 离线 · 点击地面：种下新芽（切到亮色看白天）"
      : "白天 · 一棵树 = 一台服务器 · 树冠泛黄、变红 = CPU 偏高 · 落叶 = 流量 · 风力 = 全站总流量 · 枯树 = 离线 · 点击地面：种下新芽（切到暗色看夜晚）",
    cs: (w) => (w < 640 ? 7 : 9),
    pal: (d) => d
      ? { c: ["#d6d2c4", "#e8957f", "#c9a04a", "#d0644d", "#5c5a52", "#1d2a36", "#20342a", "#3d6a45", "#3f7a4f", "#4a3a2c", "#eaf27a", "#ece4c6", "#c8d2e6", "#2b281f"], g: "#0c1218" }
      : { c: ["#3c3a33", "#ad4637", "#c08a2e", "#b8452f", "#8f897d", "#9fb39a", "#7f9a72", "#5f8a46", "#3f7a46", "#7a5a3e", "#c9b43a", "#e2a23b", "#aab8bd", "#9a8466"], g: "#f3efe3" },
    init() {
      this.leaves = [];
      this.sprouts = [];
      this.wind = 0.4;
      this.ff = NODES.map((n, i) => Array.from({ length: 14 }, (_, k) => ({ a: hash(i, k) * 6.28, r: 0.5 + hash(k, i) * 0.9, sp: (0.3 + hash(k + 3, i) * 0.6) * (hash(k, i + 5) < 0.5 ? -1 : 1), ph: hash(i + 7, k) * 6.28, x: 0, y: 0, ready: false })));
    },
    resize() {
      const v = G.view;
      this.hz = Math.round(v.y0 + (v.y1 - v.y0) * 0.64);
      const sc = clamp((v.y1 - v.y0) / 70, 0.55, 1.3), span = v.x1 - v.x0;
      this.trees = NODES.map((n, i) => {
        const Ht = (7 + n.mem * 6 + n.disk * 3) * sc;
        return { i, x: v.x0 + span * (0.05 + (0.9 * (i + 0.5)) / NODES.length) + (hash(i, 11) - 0.5) * span * 0.02, base: this.hz + 1 + (i % 3), H: Ht, hw: Ht * 0.32 + 1.5 };
      });
      this.clouds = [0, 1, 2, 3].map((k) => ({ x: hash(k, 21) * G.cols, y: v.y0 + 2 + hash(k, 22) * (this.hz - v.y0) * 0.35, w: 6 + hash(k, 23) * 8 }));
      for (const arr of this.ff) for (const f of arr) f.ready = false;
    },
    canopyCol(n) { return n.s.cpu >= 90 ? 3 : n.s.cpu >= 75 ? 2 : 8; },
    leaf(tr, n) {
      this.leaves.push({ x: tr.x + (Math.random() - 0.5) * tr.hw * 1.6, y: tr.base - tr.H * (0.3 + Math.random() * 0.6), vy: 2.5 + Math.random() * 2, ph: Math.random() * 6, col: this.canopyCol(n), rest: 0, ch: "*,'`"[Math.floor(Math.random() * 4)] });
    },
    step(dt, t) {
      const d = isDark();
      const tot = NODES.reduce((s, n) => s + (n.online ? n.s.net : 0), 0);
      this.wind += (0.25 + Math.min(2.2, tot / (14 * MB)) - this.wind) * Math.min(1, dt * 0.8);
      if (!d) for (const tr of this.trees) {
        const n = NODES[tr.i];
        if (n.online && Math.random() < Math.min(6, 0.2 + (n.s.net / MB) * 0.9) * dt) this.leaf(tr, n);
      }
      for (const l of this.leaves) {
        if (l.rest > 0) { l.rest += dt; continue; }
        l.ph += dt * 3;
        l.x += (this.wind * 2.6 + Math.sin(l.ph) * 1.2) * dt;
        l.y += l.vy * dt;
        if (l.y >= this.hz + 1 + Math.floor(hash(Math.round(l.x), 3) * 2)) l.rest = 0.001;
      }
      this.leaves = this.leaves.filter((l) => l.rest < 4 && l.x < G.cols + 2);
      if (this.leaves.length > 500) this.leaves.splice(0, this.leaves.length - 500);
      for (const tr of this.trees) {
        const n = NODES[tr.i], cx = tr.x, cy = tr.base - tr.H * 0.55;
        const active = n.online ? Math.min(14, 2 + Math.round((n.s.net / MB) * 2.2)) : 0;
        const freq = 0.6 + (n.s.cpu / 100) * 3;
        this.ff[tr.i].forEach((f, k) => {
          f.on = k < active;
          if (!f.ready) { f.x = cx; f.y = cy; f.ready = true; }
          f.a += f.sp * dt;
          f.ph += dt * freq * Math.PI * (0.8 + hash(k, tr.i) * 0.4);
          let tx = cx + Math.cos(f.a) * tr.hw * 1.5 * f.r + (vnoise(t * 0.3 + k, tr.i) - 0.5) * 4;
          let ty = cy + Math.sin(f.a * 1.3) * tr.H * 0.45 * f.r;
          if (mouse.on && Math.hypot(mouse.x - f.x, mouse.y - f.y) < 14) { tx = mouse.x + Math.cos(f.a * 2) * 2.5; ty = mouse.y + Math.sin(f.a * 2) * 1.5; }
          f.x += (tx - f.x) * Math.min(1, dt * 1.2);

    },
    click(x, y) {
      if (y >= this.hz - 1) {
        if (this.sprouts.length > 40) this.sprouts.shift();
        this.sprouts.push({ x: Math.round(x), t: 0 });
        return;
      }
      if (isDark()) {
        for (const arr of this.ff) for (const f of arr) {
          const dx = f.x - x, dy = f.y - y, dd = Math.hypot(dx, dy) || 1;
          if (dd < 16) { f.x += (dx / dd) * 6; f.y += (dy / dd) * 4; }
        }
      } else {
        const tr = this.trees.reduce((a, b) => (Math.abs(b.x - x) < Math.abs(a.x - x) ? b : a));
        const n = NODES[tr.i];
        if (n.online) for (let k = 0; k < 14; k++) this.leaf(tr, n);
      }
    },
  };

  // ---------------- 外壳 ----------------
  const SCENES = { sea, map, forest };
  let scene = null, cardsOn = store.get("cards") !== "off";

  function computeView() {
    const cs = G.cs;
    const lb = $("#legend").getBoundingClientRect();
    const v = { x0: 1, x1: G.cols - 1, y0: Math.ceil((lb.bottom + 6) / cs), y1: G.rows };
    if (cardsOn) {
      const r = $("#roster").getBoundingClientRect();
      if (r.width) {
        if (r.left > W * 0.5) v.x1 = Math.floor((r.left - 12) / cs);
        else v.y1 = Math.floor((r.top - 6) / cs);
      }
    }
    G.view = v;
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    G.cs = scene.cs(W);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    G.cols = Math.ceil(W / G.cs);
    G.rows = Math.ceil(H / G.cs);
    const n = G.cols * G.rows;
    G.ink = new Float32Array(n); G.col = new Uint8Array(n); G.ch = new Uint16Array(n); G.mode = new Uint8Array(n);
    computeView();
    scene.resize();
  }
  function setLegend() {
    $("#legend").innerHTML = "";
    const b = document.createElement("b");
    b.textContent = scene.title;
    $("#legend").append(b, scene.legend(isDark()));
  }
  function setScene(key) {
    if (!SCENES[key]) key = "sea";
    scene = SCENES[key];
    if (!scene.ready) { scene.init(); scene.ready = true; }
    document.body.dataset.scene = key;
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.scene === key)));
    setLegend();
    store.set("scene", key);
    if (location.hash !== "#" + key) history.replaceState(null, "", "#" + key);
    resize();
  }

  // 节点卡片
  const list = $("#list");
  for (const n of NODES) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "node";
    b.dataset.i = n.i;
    b.innerHTML = '<span class="n-name"></span><span class="pill"></span><span class="n-m"><span class="m-cpu">CPU <b></b></span><span class="m-mem">MEM <b></b></span><span class="m-net">↓↑ <b></b></span></span>';
    b.querySelector(".n-name").textContent = n.name;
    const code = document.createElement("span");
    code.className = "n-code";
    code.textContent = n.code;
    b.querySelector(".n-name").append(code);
    list.append(b);
    n.el = b;
  }
  function syncFocus() {
    focusId = hoverId ?? pinned;
    for (const n of NODES) {
      n.el.classList.toggle("focus", focusId === n.i);
      n.el.classList.toggle("pinned", pinned === n.i);
    }
  }
  list.addEventListener("pointerover", (e) => { const b = e.target.closest(".node"); if (b) { hoverId = +b.dataset.i; syncFocus(); } });
  list.addEventListener("pointerleave", () => { hoverId = null; syncFocus(); });
  list.addEventListener("click", (e) => { const b = e.target.closest(".node"); if (!b) return; const i = +b.dataset.i; pinned = pinned === i ? null : i; syncFocus(); });
  function updateCards() {
    let on = 0, net = 0;
    for (const n of NODES) {
      const el = n.el;
      el.classList.toggle("offline", !n.online);
      const pill = el.querySelector(".pill");
      pill.textContent = n.online ? (n.stress > 0 ? "压测中" : "在线") : "离线";
      pill.className = "pill" + (n.online ? (n.stress > 0 ? " warn" : "") : " off");
      const c = el.querySelector(".m-cpu"), m = el.querySelector(".m-mem");
      c.className = "m-cpu " + (n.online ? level(n.cpu) : "");
      c.lastChild.textContent = n.online ? n.cpu.toFixed(0) + "%" : "—";
      m.className = "m-mem " + (n.online ? level(n.memNow * 100) : "");
      m.lastChild.textContent = n.online ? (n.memNow * 100).toFixed(0) + "%" : "—";
      el.querySelector(".m-net b").textContent = n.online ? rate(n.rx + n.tx) : "—";
      if (n.online) { on++; net += n.rx + n.tx; }
    }
    $("#sum").textContent = `在线 ${on}/${NODES.length} · ${rate(net)}`;
  }

  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function refresh() { simulate(); updateCards(); }
  $("#ev-off").addEventListener("click", () => {
    const c = NODES.filter((n) => n.online);
    if (!c.length) return toast("已经没有在线节点了");
    const n = pick(c);
    n.forcedOff = true;
    refresh();
    toast(`${n.code} 断开了`);
  });
  $("#ev-cpu").addEventListener("click", () => {
    const c = NODES.filter((n) => n.online && !n.stress);
    if (!c.length) return toast("没有可以压测的在线节点");
    const n = pick(c);
    n.stress = 15;
    refresh();
    toast(`${n.code} CPU 压测中，持续 15 秒`);
  });
  $("#ev-net").addEventListener("click", () => { surge = 15; refresh(); toast("全站流量 ×5，持续 15 秒"); });
  $("#ev-reset").addEventListener("click", () => {
    surge = 0;
    for (const n of NODES) { n.forcedOff = false; n.stress = 0; }
    refresh();
    toast("全部恢复");
  });
  $("#theme").addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("theme", next);
    setLegend();
  });
  darkMQ.addEventListener?.("change", setLegend);
  function applyCards() {
    document.body.classList.toggle("cards-off", !cardsOn);
    $("#cards").setAttribute("aria-pressed", String(cardsOn));
  }
  $("#cards").addEventListener("click", () => {
    cardsOn = !cardsOn;
    store.set("cards", cardsOn ? "on" : "off");
    applyCards();
    requestAnimationFrame(resize);
  });
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setScene(b.dataset.scene)));
  addEventListener("hashchange", () => setScene(location.hash.slice(1)));
  let rz = 0;
  addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(resize); });
  addEventListener("pointermove", (e) => { mouse.x = e.clientX / G.cs; mouse.y = e.clientY / G.cs; mouse.on = e.target === cv; });
  document.addEventListener("pointerleave", () => { mouse.on = false; });
  cv.addEventListener("click", (e) => scene.click(e.clientX / G.cs, e.clientY / G.cs));

  applyCards();
  simulate();
  updateCards();
  setScene(location.hash.slice(1) || store.get("scene") || "sea");
  setInterval(refresh, 1000);

  let last = performance.now(), T = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * (reduceMotion ? 0.35 : 1);
    last = now;
    T += dt;
    surge = Math.max(0, surge - dt);
    const k = Math.min(1, dt * 2.5);
    for (const n of NODES) {
      n.stress = Math.max(0, n.stress - dt);
      n.s.cpu += (n.cpu - n.s.cpu) * k;
      n.s.net += (n.rx + n.tx - n.s.net) * k;
      n.s.mem += (n.memNow - n.s.mem) * k;
    }
    scene.step(dt, T);
    G.ink.fill(0);
    G.labels.length = 0;
    scene.draw(T);
    const p = scene.pal(isDark());
    render(p.c, p.g);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
